<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP 1 Cafetería - Ledesma Vanesa</title>

    <!-- Tipografías del proyecto -->
    <!-- Adobe Typekit: baloo-2 (Títulos y destacados) -->
    <link rel="stylesheet" href="https://use.typekit.net/ojs4bwh.css">

    <!-- Google Fonts: Montserrat (Textos y apoyo) + Sniglet (Detalles y frases) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Sniglet:wght@400;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS (incluye el sistema de grillas: container, row, col) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Estilos propios -->
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <!-- Estructura base utilizando el sistema de grillas de Bootstrap 5 -->
    <main class="container my-5">
        <header class="text-center mb-4">
            <h1>Cafetería</h1>
            <p class="text-secondary">Trabajo Práctico N° 1</p>
        </header>

        <!-- Fila con columnas responsivas de ejemplo -->
        <div class="row g-4">
            <div class="col-12 col-md-4">
                <div class="p-4 border rounded bg-light text-center shadow-sm">
                    <h3>Columna 1</h3>
                    <p>Contenido / Producto</p>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="p-4 border rounded bg-light text-center shadow-sm">
                    <h3>Columna 2</h3>
                    <p>Contenido / Producto</p>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="p-4 border rounded bg-light text-center shadow-sm">
                    <h3>Columna 3</h3>
                    <p>Contenido / Producto</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
